name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publish GUI (win-x64)
        run: dotnet publish src/RageForge.Gui -c Release -r win-x64 -p:Version=${{ env.VERSION }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:TreatWarningsAsErrors=false -o publish/gui

      - name: Publish CLI (win-x64)
        run: dotnet publish src/RageForge.Cli -c Release -r win-x64 -p:Version=${{ env.VERSION }} --self-contained true -p:PublishSingleFile=true -p:TreatWarningsAsErrors=false -o publish/cli

      - name: Package
        shell: pwsh
        run: |
          foreach ($d in 'publish/gui', 'publish/cli') { Copy-Item LICENSE, COPYING, THIRD_PARTY_NOTICES.md $d; Copy-Item licenses $d -Recurse }
          Compress-Archive -Path publish/gui/* -DestinationPath RageForge-gui-win-x64.zip
          Compress-Archive -Path publish/cli/* -DestinationPath RageForge-cli-win-x64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RageForge-gui-win-x64.zip
            RageForge-cli-win-x64.zip
